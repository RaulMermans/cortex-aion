<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CORTEX AION | Closure integrity</title>
<style>
:root{color-scheme:dark;--bg:#0b1017;--panel:#131b25;--border:#283748;--muted:#a2b3c7;--accent:#77b7ac}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eaf1f7;font:15px/1.6 system-ui,sans-serif}header,main{max-width:1120px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}h1{font-size:clamp(28px,5vw,46px);line-height:1.15;letter-spacing:-.04em;margin:12px 0}h2{font-size:21px;margin:0 0 12px}h3{margin:12px 0 4px}p{margin:8px 0;color:var(--muted)}small,.eyebrow{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.13em}.brand{font-weight:750;letter-spacing:.18em}.accent{color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:24px 0}.panel{padding:22px;border:1px solid var(--border);border-radius:14px;background:var(--panel);margin-bottom:14px}.metric{font-size:32px;font-weight:650;font-variant-numeric:tabular-nums}.actions{display:flex;gap:10px;flex-wrap:wrap}button{background:#203c42;color:#e4fffa;border:1px solid #416b70;border-radius:8px;padding:10px 15px;cursor:pointer;font:inherit}button:disabled{opacity:.5;cursor:wait}details{margin-top:14px;border-top:1px solid var(--border);padding-top:12px}summary{cursor:pointer;color:var(--accent)}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--border);white-space:nowrap}th{color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);font-size:12px}.warn{color:#f2c683}#notice{min-height:28px}
</style></head><body>
<header><div class="brand">CORTEX <span class="accent">AION</span></div><small>Operations intelligence / 02</small></header>
<main><div class="eyebrow">Operational assurance · Case review</div><h1>Closure integrity review</h1><p>Identify incomplete closure records, inspect evidence and prepare a review for operations teams.</p>
<div class="actions"><button id="refresh">Run investigation</button><button id="export" disabled>Export evidence JSON</button></div><p id="notice" role="status" aria-live="polite"></p><div id="output"></div></main>
<script>
const out=document.querySelector('#output'),notice=document.querySelector('#notice'),refresh=document.querySelector('#refresh'),exportButton=document.querySelector('#export');let report=null;
function el(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=String(text);if(cls)node.className=cls;return node;}
function add(parent,tag,text,cls){const n=el(tag,text,cls);parent.append(n);return n;}
function render(r){out.replaceChildren();const source=add(out,'section',undefined,'panel');add(source,'small',r.provenance.mode==='azure'?'Azure-connected batch':'Synthetic demo — not Azure-connected','accent');add(source,'p',r.provenance.scope);
const grid=add(out,'div',undefined,'grid');for(const [k,v] of [['Batch records',r.batch_records],['Accepted',r.silver_records],['Flagged',r.quarantine_records],['Closure exceptions',r.closure_exceptions]]){const p=add(grid,'div',undefined,'panel');add(p,'small',k);add(p,'div',v.toLocaleString(),'metric');}
add(out,'h2','Review queue');if(!r.cases.length)add(out,'p','No closure-date exceptions in this batch.');if(r.other_exceptions)add(out,'p',r.other_exceptions+' other quality exceptions are outside this review.','warn');
for(const c of r.cases){const p=add(out,'section',undefined,'panel');add(p,'small','Review required · '+c.agency,'warn');add(p,'h2',c.title);add(p,'p',c.affected+' of '+c.agency_total+' agency records ('+c.exception_rate+'%)');add(p,'h3','Finding');add(p,'p',c.finding);add(p,'h3','Proposed action');add(p,'p',c.recommendation);add(p,'p',c.limitation,'warn');const d=add(p,'details');add(d,'summary','Inspect '+c.evidence.length+' supporting records');const table=add(add(d,'div',undefined,'scroll'),'table'),head=add(table,'thead'),hr=add(head,'tr');const cols=['unique_key','agency','complaint_type','status','closed_date','quality_reason'];for(const col of cols)add(hr,'th',col);const body=add(table,'tbody');for(const record of c.evidence){const tr=add(body,'tr');for(const col of cols)add(tr,'td',record[col]??'—');}}
const p=add(out,'section',undefined,'panel');add(p,'h2','Evidence provenance');add(p,'pre',JSON.stringify(r.provenance,null,2));}
async function run(){refresh.disabled=true;exportButton.disabled=true;report=null;out.replaceChildren();notice.textContent='Reading configured batch…';try{const res=await fetch('/api/investigation',{cache:'no-store'});if(!res.ok)throw Error('Investigation unavailable. Check server configuration and Azure access.');report=await res.json();render(report);notice.textContent='Review ready.';exportButton.disabled=false;}catch(e){notice.textContent=e.message;}finally{refresh.disabled=false;}}
refresh.onclick=run;exportButton.onclick=()=>{if(!report)return;const url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='cortex-aion-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};run();
</script></body></html>
